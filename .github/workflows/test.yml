# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 5
# Experiment Memory System
# ============================================================

name: Quant Research Test


on:

  push:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  run-python:


    runs-on: ubuntu-latest


    steps:


      # ------------------------------------------------------
      # STEP 1
      # DOWNLOAD CODE
      # ------------------------------------------------------

      - name: Step 1 - Get repository

        uses: actions/checkout@v5



      # ------------------------------------------------------
      # STEP 2
      # INSTALL PYTHON
      # ------------------------------------------------------

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"



      # ------------------------------------------------------
      # STEP 3
      # RUN EXPERIMENT
      # ------------------------------------------------------

      - name: Step 3 - Run research experiment

        run: |

          python hello.py



      # ------------------------------------------------------
      # STEP 4
      # SHOW CREATED EXPERIMENT
      # ------------------------------------------------------

      - name: Step 4 - Check experiment folder

        run: |

          echo "======================================"
          echo "CHECKING EXPERIMENT OUTPUT"
          echo "======================================"


          ls -R experiments



      # ------------------------------------------------------
      # STEP 5
      # SAVE COMPLETE EXPERIMENT
      # ------------------------------------------------------

      - name: Step 5 - Save experiment archive

        uses: actions/upload-artifact@v4

        with:

          name: experiment-history

          path: |

            experiments/
            
            leaderboard.csv


      # ------------------------------------------------------
      # STEP 6
      # SAVE LEADERBOARD BACK TO GITHUB
      # ------------------------------------------------------

      - name: Step 6 - Commit experiment memory

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add leaderboard.csv


          git commit -m "Update experiment leaderboard" || echo "No changes to commit"


          git push

      # ------------------------------------------------------
      # STEP 7
      # SUCCESS MESSAGE
      # ------------------------------------------------------

      - name: Step 7 - Complete

        run: |

          echo ""
          echo "======================================"
          echo "EXPERIMENT SUCCESSFULLY SAVED"
          echo "======================================"

          echo ""

          echo "Saved contents:"

          ls -R experiments
