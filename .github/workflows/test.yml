# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 9
# GitHub → Experiment → Kaggle
# ============================================================
#
# PURPOSE:
#
# This level introduces the first connection between our
# GitHub research system and Kaggle.
#
# Architecture:
#
# GitHub
#     ↓
# GitHub Actions
#     ↓
# Python experiment
#     ↓
# EXP-XXXX
#     ↓
# CSV + JSON
#     ↓
# GitHub Artifact
#     ↓
# Kaggle
#
# IMPORTANT:
#
# The experiment itself is considered successful before Kaggle
# is contacted.
#
# This prevents a temporary Kaggle/API problem from destroying
# our experiment record.
#
# ============================================================

name: Quant Research Test


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  push:

  workflow_dispatch:

    inputs:

      force_rerun:

        description: "Run even if parameters.json has not changed"

        required: false

        type: boolean

        default: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# PREVENT TWO RUNS FROM WRITING AT THE SAME TIME
# ============================================================

concurrency:

  group: quant-research-experiments

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  run-python:

    runs-on: ubuntu-latest


    steps:


      # ------------------------------------------------------
      # STEP 1
      # GET REPOSITORY
      # ------------------------------------------------------

      - name: Step 1 - Get repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # STEP 2
      # SET UP PYTHON
      # ------------------------------------------------------

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ------------------------------------------------------
      # STEP 3
      # RUN RESEARCH EXPERIMENT
      # ------------------------------------------------------

      - name: Step 3 - Run research experiment

        env:

          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}

        run: |

          python hello.py


      # ------------------------------------------------------
      # STEP 4
      # CHECK EXPERIMENT OUTPUT
      # ------------------------------------------------------

      - name: Step 4 - Verify experiment output

        run: |

          echo "=============================================="
          echo "VERIFYING EXPERIMENT OUTPUT"
          echo "=============================================="

          echo ""

          if [ ! -d "experiments" ]; then

            echo "No experiments directory found."

            exit 1

          fi

          echo "Experiment directory contents:"
          echo ""

          find experiments -maxdepth 3 -type f -print

          echo ""

          echo "Verification complete."


      # ------------------------------------------------------
      # STEP 5
      # DISPLAY LEADERBOARD
      # ------------------------------------------------------

      - name: Step 5 - Show leaderboard

        run: |

          echo "=============================================="
          echo "CURRENT LEADERBOARD"
          echo "=============================================="

          echo ""

          if [ -f leaderboard.csv ]; then

            cat leaderboard.csv

          else

            echo "leaderboard.csv does not exist."

          fi


      # ------------------------------------------------------
      # STEP 6
      # SAVE EXPERIMENT AS ARTIFACT
      # ------------------------------------------------------

      - name: Step 6 - Save experiment archive

        uses: actions/upload-artifact@v4

        with:

          name: experiment-history-${{ github.run_id }}

          path: |

            experiments/

            leaderboard.csv


      # ------------------------------------------------------
      # STEP 7
      # INSTALL KAGGLE CLI
      # ------------------------------------------------------
      #
      # Kaggle's current API provides a CLI for programmatic
      # dataset interaction.
      #
      # ------------------------------------------------------

      - name: Step 7 - Install Kaggle CLI

        run: |

          python -m pip install --upgrade pip

          pip install kaggle


      # ------------------------------------------------------
      # STEP 8
      # CHECK KAGGLE CREDENTIALS
      # ------------------------------------------------------
      #
      # We deliberately do NOT print the secret itself.
      #
      # We only verify that the required GitHub Secrets exist.
      #
      # Expected secrets:
      #
      # KAGGLE_USERNAME
      # KAGGLE_KEY
      #
      # ------------------------------------------------------

      - name: Step 8 - Check Kaggle credentials

        env:

          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

        run: |

          echo "=============================================="
          echo "CHECKING KAGGLE CONNECTION SETTINGS"
          echo "=============================================="

          echo ""

          if [ -z "$KAGGLE_USERNAME" ]; then

            echo "ERROR: KAGGLE_USERNAME secret is missing."

            exit 1

          fi

          if [ -z "$KAGGLE_KEY" ]; then

            echo "ERROR: KAGGLE_KEY secret is missing."

            exit 1

          fi

          echo "Kaggle credentials are present."

          echo "Username:"
          echo "$KAGGLE_USERNAME"


      # ------------------------------------------------------
      # STEP 9
      # TEST KAGGLE API
      # ------------------------------------------------------
      #
      # We test authentication separately from uploading.
      #
      # This makes the system easier to understand and debug.
      #
      # ------------------------------------------------------

      - name: Step 9 - Test Kaggle API

        env:

          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

        run: |

          echo "=============================================="
          echo "TESTING KAGGLE API"
          echo "=============================================="

          echo ""

          kaggle datasets list --max-size 1

          echo ""

          echo "Kaggle API connection successful."


      # ------------------------------------------------------
      # STEP 10
      # PREPARE KAGGLE DATA
      # ------------------------------------------------------

      - name: Step 10 - Prepare Kaggle experiment data

        run: |

          echo "=============================================="
          echo "PREPARING KAGGLE DATA"
          echo "=============================================="

          mkdir -p kaggle_upload

          echo ""

          echo "Copying experiment files..."

          cp -r experiments/* kaggle_upload/

          echo ""

          echo "Files prepared for Kaggle:"

          find kaggle_upload -type f -print


      # ------------------------------------------------------
      # STEP 11
      # SAVE KAGGLE DATA AS ARTIFACT
      # ------------------------------------------------------
      #
      # This is an additional safety layer.
      #
      # Even if Kaggle upload fails, the files remain available
      # from GitHub Actions.
      #
      # ------------------------------------------------------

      - name: Step 11 - Archive Kaggle package

        uses: actions/upload-artifact@v4

        with:

          name: kaggle-research-data-${{ github.run_id }}

          path: kaggle_upload/


      # ------------------------------------------------------
      # STEP 12
      # KAGGLE CONNECTION CONFIRMATION
      # ------------------------------------------------------
      #
      # At Level 9 we deliberately stop here.
      #
      # We have now proven:
      #
      # GitHub
      #   ↓
      # Python
      #   ↓
      # Experiment
      #   ↓
      # Kaggle-ready data
      #   ↓
      # Kaggle API authentication
      #
      # Actual automated dataset creation/versioning will be
      # expanded carefully in the next stage rather than hiding
      # several new mechanisms inside Level 9.
      #
      # ------------------------------------------------------

      - name: Step 12 - Confirm Level 9 connection

        run: |

          echo ""

          echo "======================================================"

          echo "LEVEL 9 COMPLETED"

          echo "======================================================"

          echo ""

          echo "GitHub experiment: SUCCESS"

          echo "Experiment archive: SUCCESS"

          echo "Kaggle CLI: INSTALLED"

          echo "Kaggle credentials: FOUND"

          echo "Kaggle API connection: SUCCESS"

          echo "Kaggle research package: PREPARED"

          echo ""

          echo "The experiment is ready for the next Kaggle stage."

          echo ""

          echo "======================================================"
