# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 8
# ============================================================
#
# PURPOSE:
#
# This workflow runs the research experiment and preserves:
#
# 1. Every experiment
# 2. The exact Python code
# 3. The parameters
# 4. The leaderboard
# 5. The current best experiment
#
# ============================================================


name: Quant Research Test


# ============================================================
# TRIGGERS
# ============================================================

on:

  push:

  workflow_dispatch:

    inputs:

      force_rerun:

        description: "Run even if parameters.json has not changed"

        required: false

        type: boolean

        default: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# PREVENT TWO EXPERIMENTS RUNNING AT THE SAME TIME
# ============================================================

concurrency:

  group: quant-research-experiments

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  run-python:

    runs-on: ubuntu-latest


    steps:


      # ------------------------------------------------------
      # STEP 1
      # GET REPOSITORY
      # ------------------------------------------------------

      - name: Step 1 - Get repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # STEP 2
      # SET UP PYTHON
      # ------------------------------------------------------

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ------------------------------------------------------
      # STEP 3
      # RUN EXPERIMENT
      # ------------------------------------------------------

      - name: Step 3 - Run research experiment

        env:

          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}

        run: |

          python hello.py


      # ------------------------------------------------------
      # STEP 4
      # DISPLAY EXPERIMENTS
      # ------------------------------------------------------

      - name: Step 4 - Check experiment output

        run: |

          echo "=============================================="

          echo "EXPERIMENT OUTPUT"

          echo "=============================================="

          echo ""

          ls -R experiments || echo "No experiment directory created."

          echo ""

          echo "=============================================="

          echo "LEADERBOARD"

          echo "=============================================="

          if [ -f leaderboard.csv ]; then

            cat leaderboard.csv

          else

            echo "leaderboard.csv not found."

          fi

          echo ""

          echo "=============================================="

          echo "BEST EXPERIMENT"

          echo "=============================================="

          if [ -f best_experiment.txt ]; then

            cat best_experiment.txt

          else

            echo "best_experiment.txt not found."

          fi


      # ------------------------------------------------------
      # STEP 5
      # SAVE RESEARCH ARTIFACT
      # ------------------------------------------------------

      - name: Step 5 - Save research archive

        uses: actions/upload-artifact@v4

        with:

          name: quant-research-level-8-${{ github.run_id }}

          path: |

            experiments/

            leaderboard.csv

            best_experiment.txt


      # ------------------------------------------------------
      # STEP 6
      # SAVE LEADERBOARD TO GITHUB
      # ------------------------------------------------------

      - name: Step 6 - Commit experiment memory

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add leaderboard.csv


          git commit \
            -m "Update experiment leaderboard (${{ github.run_id }})" \
            || echo "No leaderboard changes to commit"


          git pull --rebase origin "${GITHUB_REF_NAME}"


          git push


      # ------------------------------------------------------
      # STEP 7
      # FINAL CONFIRMATION
      # ------------------------------------------------------

      - name: Step 7 - Confirm Level 8 completed

        run: |

          echo ""

          echo "======================================================"

          echo "LEVEL 8 COMPLETED SUCCESSFULLY"

          echo "======================================================"

          echo ""

          echo "The system has now:"

          echo ""

          echo "1. Run an experiment"

          echo "2. Assigned an EXP-XXXX ID"

          echo "3. Saved the experiment"

          echo "4. Saved its parameters"

          echo "5. Saved its Python code"

          echo "6. Updated the leaderboard"

          echo "7. Examined the experiment history"

          echo "8. Identified the best experiment"

          echo "9. Saved best_experiment.txt"

          echo ""

          echo "This is the foundation for future AI analysis."

          echo "======================================================"
