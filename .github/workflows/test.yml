# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 5
# Experiment Memory System
# ============================================================
name: Quant Research Test

on:
  push:
  workflow_dispatch:

# Fixes duplicate IDs by ensuring workflows run sequentially, never concurrently
concurrency:
  group: leaderboard-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Get repository
        uses: actions/checkout@v4

      - name: Step 2 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Step 3 - Run research experiment
        run: |
          python hello.py

      - name: Step 4 - Check experiment folder
        run: |
          echo "======================================"
          echo "CHECKING EXPERIMENT OUTPUT"
          echo "======================================"
          ls -R experiments

      - name: Step 5 - Save experiment archive
        uses: actions/upload-artifact@v4
        with:
          name: experiment-history
          path: |
            experiments/
            leaderboard.csv

      - name: Step 6 - Commit experiment memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global pull.rebase true
          
          # Pull latest changes right before commit to avoid push rejections
          git pull origin main || true
          
          git add leaderboard.csv experiments/
          git commit -m "Update experiment leaderboard" || echo "No changes to commit"
          git push

      - name: Step 7 - Complete
        run: |
          echo ""
          echo "======================================"
          echo "EXPERIMENT SUCCESSFULLY SAVED"
          echo "======================================"
          echo ""
          echo "Saved contents:"
          ls -R experiments
