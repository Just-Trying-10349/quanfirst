# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 3
# ============================================================

name: Quant Research Test

on:

  # Automatically run whenever we push code
  push:

  # Allow manual execution
  workflow_dispatch:


jobs:

  run-python:

    # GitHub gives us a temporary Linux computer
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # STEP 1 — Download our repository
      # --------------------------------------------------------

      - name: Get our code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # STEP 2 — Install Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # STEP 3 — Run our experiment
      # --------------------------------------------------------

      - name: Run research experiment
        run: python hello.py


      # --------------------------------------------------------
      # STEP 4 — Preserve the result
      # --------------------------------------------------------
      #
      # GitHub's computer is temporary.
      #
      # The artifact allows us to keep the result after
      # the computer is destroyed.
      #

      - name: Save experiment result
        uses: actions/upload-artifact@v4

        with:

          name: experiment-result

          path: experiment_result.txt
