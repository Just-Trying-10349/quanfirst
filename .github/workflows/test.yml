# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 9
# ============================================================
#
# GITHUB → PYTHON → EXPERIMENT → KAGGLE
#
# PURPOSE:
#
# Level 9 introduces our first controlled connection to Kaggle.
#
# We are NOT yet asking Kaggle to create a permanent Dataset.
#
# Instead we prove each layer independently:
#
#     GitHub
#        ↓
#     GitHub Actions
#        ↓
#     Python
#        ↓
#     Experiment
#        ↓
#     Experiment archive
#        ↓
#     Kaggle CLI
#        ↓
#     Kaggle authentication
#        ↓
#     Kaggle-ready research package
#
#
# This deliberately keeps Level 9 simple.
#
# Later:
#
# Level 10 → AI analysis
# Level 11 → AI correction / improvement
# Level 12 → stronger automation
# Level 13 → Machine Learning
# Level 16 → Alpaca API
#
# ============================================================


name: Quant Research Test


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Run automatically when repository changes
  push:

  # Allow manual execution
  workflow_dispatch:

    inputs:

      force_rerun:

        description: "Run even if parameters.json has not changed"

        required: false

        type: boolean

        default: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# PREVENT SIMULTANEOUS EXPERIMENT WRITES
# ============================================================

concurrency:

  group: quant-research-experiments

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  run-python:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # STEP 1
      # GET REPOSITORY
      # ======================================================

      - name: Step 1 - Get repository

        uses: actions/checkout@v5


      # ======================================================
      # STEP 2
      # SET UP PYTHON
      # ======================================================

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ======================================================
      # STEP 3
      # RUN OUR EXPERIMENT
      # ======================================================

      - name: Step 3 - Run research experiment

        env:

          FORCE_RERUN: ${{ github.event.inputs.force_rerun || 'false' }}

        run: |

          echo "=============================================="

          echo "RUNNING QUANT RESEARCH EXPERIMENT"

          echo "=============================================="

          echo ""

          python hello.py


      # ======================================================
      # STEP 4
      # VERIFY EXPERIMENT
      # ======================================================

      - name: Step 4 - Verify experiment output

        run: |

          echo "=============================================="

          echo "VERIFYING EXPERIMENT"

          echo "=============================================="

          echo ""

          if [ ! -d "experiments" ]; then

            echo "ERROR: experiments directory does not exist."

            exit 1

          fi


          echo "Experiment directory exists."

          echo ""

          echo "Experiment files:"

          find experiments -type f -print


          echo ""

          echo "Experiment verification successful."


      # ======================================================
      # STEP 5
      # SHOW LEADERBOARD
      # ======================================================

      - name: Step 5 - Show leaderboard

        run: |

          echo "=============================================="

          echo "LEADERBOARD"

          echo "=============================================="

          echo ""


          if [ -f leaderboard.csv ]; then

            cat leaderboard.csv

          else

            echo "leaderboard.csv does not exist."

          fi


      # ======================================================
      # STEP 6
      # SAVE EXPERIMENT ARTIFACT
      # ======================================================

      - name: Step 6 - Save experiment archive

        uses: actions/upload-artifact@v4

        with:

          name: experiment-history-${{ github.run_id }}

          path: |

            experiments/

            leaderboard.csv


      # ======================================================
      # STEP 7
      # INSTALL KAGGLE CLI
      # ======================================================

      - name: Step 7 - Install Kaggle CLI

        run: |

          echo "=============================================="

          echo "INSTALLING KAGGLE CLI"

          echo "=============================================="

          echo ""

          python -m pip install --upgrade pip

          pip install kaggle


          echo ""

          echo "Kaggle CLI version:"

          kaggle --version


      # ======================================================
      # STEP 8
      # CHECK KAGGLE TOKEN
      # ======================================================
      #
      # We never print the actual secret.
      #
      # We only check that GitHub supplied it.
      #
      # ======================================================

      - name: Step 8 - Check Kaggle authentication

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          echo "=============================================="

          echo "CHECKING KAGGLE AUTHENTICATION"

          echo "=============================================="

          echo ""


          if [ -z "$KAGGLE_API_TOKEN" ]; then

            echo "ERROR: KAGGLE_API_TOKEN is missing."

            echo ""

            echo "Create a GitHub repository secret named:"

            echo "KAGGLE_API_TOKEN"

            exit 1

          fi


          echo "KAGGLE_API_TOKEN is present."

          echo "Secret successfully supplied to GitHub Actions."


      # ======================================================
      # STEP 9
      # TEST KAGGLE AUTHENTICATION
      # ======================================================

      - name: Step 9 - Test Kaggle API connection

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          echo "=============================================="

          echo "TESTING KAGGLE API CONNECTION"

          echo "=============================================="

          echo ""


          kaggle auth print-access-token > /tmp/kaggle_test_token.txt


          if [ ! -s /tmp/kaggle_test_token.txt ]; then

            echo "ERROR: Kaggle authentication test failed."

            exit 1

          fi


          echo "Kaggle authentication successful."


          # Delete the temporary token immediately.

          rm -f /tmp/kaggle_test_token.txt


      # ======================================================
      # STEP 10
      # PREPARE KAGGLE RESEARCH PACKAGE
      # ======================================================

      - name: Step 10 - Prepare Kaggle research package

        run: |

          echo "=============================================="

          echo "PREPARING KAGGLE RESEARCH PACKAGE"

          echo "=============================================="

          echo ""


          rm -rf kaggle_upload

          mkdir -p kaggle_upload


          echo "Copying experiment data..."


          cp -r experiments/. kaggle_upload/


          echo ""


          echo "Copying leaderboard..."


          if [ -f leaderboard.csv ]; then

            cp leaderboard.csv kaggle_upload/

          fi


          echo ""

          echo "Kaggle package contents:"

          find kaggle_upload -type f -print


      # ======================================================
      # STEP 11
      # SAVE KAGGLE PACKAGE AS GITHUB ARTIFACT
      # ======================================================
      #
      # This gives us a safety copy.
      #
      # Even if Kaggle later has a problem, our research
      # package is still available from GitHub Actions.
      #
      # ======================================================

      - name: Step 11 - Save Kaggle research package

        uses: actions/upload-artifact@v4

        with:

          name: kaggle-research-package-${{ github.run_id }}

          path: kaggle_upload/


      # ======================================================
      # STEP 12
      # COMMIT LEADERBOARD
      # ======================================================

      - name: Step 12 - Save experiment memory

        run: |

          echo "=============================================="

          echo "SAVING EXPERIMENT MEMORY"

          echo "=============================================="

          echo ""


          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add leaderboard.csv


          git commit \
            -m "Update experiment leaderboard (${{ github.run_id }})" \
            || echo "No leaderboard changes to commit."


          for attempt in 1 2 3 4 5

          do

            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push \
              && break


            echo "Push attempt $attempt failed."

            echo "Retrying..."

            sleep $((RANDOM % 5 + 1))

          done


      # ======================================================
      # STEP 13
      # FINAL LEVEL 9 CONFIRMATION
      # ======================================================

      - name: Step 13 - Level 9 complete

        run: |

          echo ""

          echo "======================================================"

          echo "LEVEL 9 COMPLETED SUCCESSFULLY"

          echo "======================================================"

          echo ""

          echo "GitHub repository:       SUCCESS"

          echo "Python environment:     SUCCESS"

          echo "Research experiment:    SUCCESS"

          echo "Experiment verification: SUCCESS"

          echo "GitHub artifact:         SUCCESS"

          echo "Kaggle CLI:              SUCCESS"

          echo "Kaggle authentication:   SUCCESS"

          echo "Kaggle package:          SUCCESS"

          echo ""

          echo "The research system is now connected to Kaggle."

          echo ""

          echo "NEXT STAGE:"

          echo "Level 10 → AI reads and analyzes our research."

          echo ""

          echo "======================================================"
