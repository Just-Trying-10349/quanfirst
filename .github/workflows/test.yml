# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 9
# GITHUB → KAGGLE
# ============================================================
#
# PURPOSE:
#
# This workflow:
#
# 1. Gets our GitHub repository
# 2. Installs Python
# 3. Verifies our existing experiment system
# 4. Installs the Kaggle CLI
# 5. Authenticates with Kaggle
# 6. Sends our Level 9 experiment to Kaggle
# 7. Tells Kaggle to run it
# 8. Checks the Kaggle job
#
# ============================================================


name: Quant Research Test


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  push:

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# PREVENT SIMULTANEOUS RUNS
# ============================================================

concurrency:

  group: quant-research-experiments

  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  run-python:

    runs-on: ubuntu-latest


    steps:


      # ------------------------------------------------------
      # STEP 1
      # GET REPOSITORY
      # ------------------------------------------------------

      - name: Step 1 - Get repository

        uses: actions/checkout@v5


      # ------------------------------------------------------
      # STEP 2
      # SET UP PYTHON
      # ------------------------------------------------------

      - name: Step 2 - Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ------------------------------------------------------
      # STEP 3
      # RUN OUR EXISTING LOCAL EXPERIMENT
      # ------------------------------------------------------

      - name: Step 3 - Run local experiment

        env:

          FORCE_RERUN: "true"

        run: |

          python hello.py


      # ------------------------------------------------------
      # STEP 4
      # SHOW OUR EXISTING EXPERIMENT
      # ------------------------------------------------------

      - name: Step 4 - Show experiment output

        run: |

          echo "======================================"

          echo "CURRENT GITHUB EXPERIMENT"

          echo "======================================"

          echo ""

          ls -R experiments || true


      # ------------------------------------------------------
      # STEP 5
      # INSTALL KAGGLE CLI
      # ------------------------------------------------------

      - name: Step 5 - Install Kaggle CLI

        run: |

          python -m pip install --upgrade pip

          pip install kaggle


      # ------------------------------------------------------
      # STEP 6
      # VERIFY KAGGLE CLI
      # ------------------------------------------------------

      - name: Step 6 - Verify Kaggle CLI

        run: |

          kaggle --help


      # ------------------------------------------------------
      # STEP 7
      # PREPARE KAGGLE EXPERIMENT
      # ------------------------------------------------------

      - name: Step 7 - Prepare Kaggle experiment

        run: |

          mkdir -p kaggle/level9/run

          cp kaggle/level9/level9_kaggle.py \
             kaggle/level9/run/level9_kaggle.py

          cp parameters.json \
             kaggle/level9/run/parameters.json

          cp kaggle/level9/kernel-metadata.json \
             kaggle/level9/run/kernel-metadata.json

          echo "======================================"

          echo "KAGGLE EXPERIMENT"

          echo "======================================"

          echo ""

          ls -R kaggle/level9/run


      # ------------------------------------------------------
      # STEP 8
      # AUTHENTICATE WITH KAGGLE
      # ------------------------------------------------------

      - name: Step 8 - Authenticate with Kaggle

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          kaggle auth status


      # ------------------------------------------------------
      # STEP 9
      # PUSH AND RUN KAGGLE EXPERIMENT
      # ------------------------------------------------------

      - name: Step 9 - Send experiment to Kaggle

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          kaggle kernels push \
            -p kaggle/level9/run


      # ------------------------------------------------------
      # STEP 10
      # CHECK KAGGLE STATUS
      # ------------------------------------------------------

      - name: Step 10 - Check Kaggle status

        env:

          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

        run: |

          echo "======================================"

          echo "KAGGLE JOB STATUS"

          echo "======================================"

          kaggle kernels status \
            YOUR_KAGGLE_USERNAME/quanfirst-level9


      # ------------------------------------------------------
      # STEP 11
      # SAVE GITHUB ARTIFACT
      # ------------------------------------------------------

      - name: Step 11 - Save Level 9 files

        uses: actions/upload-artifact@v4

        with:

          name: level9-github-kaggle-test

          path: |

            parameters.json

            kaggle/level9/level9_kaggle.py

            kaggle/level9/kernel-metadata.json

            experiments/


      # ------------------------------------------------------
      # STEP 12
      # FINAL MESSAGE
      # ------------------------------------------------------

      - name: Step 12 - Level 9 complete

        run: |

          echo ""

          echo "======================================================"

          echo "LEVEL 9 GITHUB → KAGGLE TEST SUBMITTED"

          echo "======================================================"

          echo ""

          echo "GitHub successfully prepared the experiment."

          echo ""

          echo "Kaggle was instructed to execute:"

          echo "quanfirst-level9"

          echo ""

          echo "Next stage: retrieve the Kaggle output."

          echo "======================================================"
