# ============================================================
# QUANT RESEARCH AUTOMATION — LEVEL 3
# ============================================================

name: Quant Research Test

on:
  push:
  workflow_dispatch:

jobs:

  run-python:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # STEP 1 — Download repository
      # --------------------------------------------------------

      - name: Get our code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # STEP 2 — Install Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # STEP 3 — Run experiment
      # --------------------------------------------------------

      - name: Run research experiment
        run: python hello.py


      # --------------------------------------------------------
      # STEP 4 — Check that result file exists
      # --------------------------------------------------------

      - name: Verify result file
        run: |
          echo "Checking for experiment_result.txt..."

          if [ -f experiment_result.txt ]; then
            echo "SUCCESS: experiment_result.txt exists."
            echo ""
            echo "File contents:"
            cat experiment_result.txt
          else
            echo "ERROR: experiment_result.txt does not exist."
            exit 1
          fi


      # --------------------------------------------------------
      # STEP 5 — Upload result
      # --------------------------------------------------------

      - name: Save experiment result
        uses: actions/upload-artifact@v4
        with:
          name: experiment-result
          path: experiment_result.txt
